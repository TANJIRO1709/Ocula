# Full stack locally: cp .env.example .env (fill it in), then docker compose up --build
#   -> web :3000, api :8000, engine :8001. Secrets come from ./.env (gitignored).
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: ocula, POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}", POSTGRES_DB: ocula }
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U ocula"], interval: 5s, retries: 10 }
  engine:
    build: ./engine
    environment: { ENGINE_API_KEY: "${ENGINE_API_KEY:?set ENGINE_API_KEY in .env}", PORT: "8001" }
    ports: ["8001:8001"]
  api:
    build: ./gateway
    environment:
      DATABASE_URL: postgres://ocula:${POSTGRES_PASSWORD}@db:5432/ocula
      ENGINE_URL: http://engine:8001
      ENGINE_API_KEY: ${ENGINE_API_KEY}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ocula.app}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      CORS_ORIGINS: http://localhost:3000
      PUBLIC_BASE_URL: http://localhost:3000
      API_BASE_URL: http://localhost:8000
    depends_on: { db: { condition: service_healthy }, engine: { condition: service_started } }
    ports: ["8000:8000"]
  web:
    build:
      context: ./frontend
      args: { NEXT_PUBLIC_API_URL: "http://localhost:8000/api/v1" }
    depends_on: [api]
    ports: ["3000:3000"]
volumes:
  pgdata:
